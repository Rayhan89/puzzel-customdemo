/* Puzzel PCC Design System tokens: see references/design-tokens.md. Do not edit per widget. */
:root {
  --primary: #7e4797; --primary-dark: #462853; --primary-light: #cec1d4; --primary-fair: #f4e5fc;
  --g50: #f4f4f6; --g100: #e7e8eb; --g200: #b4b6c1; --g300: #8f93a3; --g400: #5c6278; --g500: #3d435e; --g600: #0c1436;
  --text: var(--g600); --text-2: var(--g400); --text-3: var(--g300);
  --canvas: #fbfbfd; --surface: #ffffff; --divider: var(--g100); --hover: var(--g50);
  --btn2: var(--g50); --btn2-hover: var(--g100); --link: var(--primary); --focus: var(--primary-dark);
  --ok: #33c4b3; --ok-text: #248b7f; --ok-bg: #c0ede7;
  --warn: #ff9903; --warn-text: #b56d02; --warn-bg: #ffdfb1;
  --bad: #ff375b; --bad-text: #b52741; --bad-bg: #ffc1cc; --bad-hover: #b52741;
  --info-text: var(--primary); --info-bg: var(--primary-fair);
  --nba-bg: linear-gradient(100deg, #f4e5fc 0%, #fbf7fe 100%);
  --radius: 8px; --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tile: #7e4797;
}
:root[data-theme="dark"] {
  --text: #ffffff; --text-2: var(--g200); --text-3: var(--g300);
  --canvas: #0c1436; --surface: #11193a; --divider: #262d4e; --hover: #171f3e;
  --btn2: var(--g500); --btn2-hover: var(--g400); --link: #dbacf5; --focus: var(--primary-light);
  --primary-fair: #262d4e; --info-text: #dbacf5;
  --ok-text: #c0ede7; --ok-bg: #248b7f; --warn-text: #ffdfb1; --warn-bg: #b56d02; --bad-text: #ffc1cc; --bad-bg: #b52741;
  --nba-bg: linear-gradient(100deg, #462853 0%, #262d4e 100%);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas); color: var(--text); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
/* Icons are inline SVG from an embedded sprite: no icon font, nothing to load, nothing to fall back to. */
.ic { width: 20px; height: 20px; fill: currentColor; flex: none; display: inline-block; vertical-align: middle; }
.num { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Frame: designed at 800px, fluid below. Container queries drive every breakpoint. */
.widget { container: widget / inline-size; width: 100%; max-width: 800px; margin: 0 auto; }
.hdr { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--divider); }
.tile { width: 36px; height: 36px; border-radius: var(--radius); background: var(--tile, var(--primary)); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 16px; flex: none; overflow: hidden; }
.tile img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.hdr-t { font-size: 16px; line-height: 24px; font-weight: 500; }
.hdr-s { font-size: 12px; line-height: 16px; color: var(--text-2); }
.hdr > div { min-width: 0; }
.body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px; }
.col { display: grid; gap: 12px; align-content: start; min-width: 0; }
.main { container: main / inline-size; }
.main > div, aside.col > * { min-width: 0; }
.grid2 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.foot { padding: 0 12px 12px; }
@container widget (min-width: 720px) { .body.rail { grid-template-columns: 256px minmax(0, 1fr); } }
@container widget (min-width: 560px) and (max-width: 719px) { aside.col { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container main (min-width: 600px) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 > .full { grid-column: 1 / -1; } }

/* Card */
.card { container: card / inline-size; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--radius); min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; padding: 12px 16px; border-bottom: 1px solid var(--divider); }
.card-h .ic { color: var(--text-2); }
.card-t { font-size: 16px; line-height: 24px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; flex: 1 1 auto; }
.src { font-size: 12px; line-height: 16px; color: var(--text-3); white-space: nowrap; }
.card-b { padding: 12px 16px 16px; }
.card-acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 16px; }
.card-b + .card-acts { margin-top: -4px; }

/* Values */
.kv { display: grid; grid-template-columns: minmax(88px, max-content) minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.kv dt { font-size: 12px; line-height: 20px; color: var(--text-2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@container card (max-width: 230px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv dd { margin-bottom: 8px; } }
.chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 2px 10px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 500; background: var(--g50); color: var(--text-2); vertical-align: middle; }
.chip .ic { width: 16px; height: 16px; }
.t-ok { background: var(--ok-bg); color: var(--ok-text); }
.t-warn { background: var(--warn-bg); color: var(--warn-text); }
.t-bad { background: var(--bad-bg); color: var(--bad-text); }
.t-info { background: var(--info-bg); color: var(--info-text); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* Buttons: PCC primary, secondary, tertiary, danger, icon */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 16px; border: 0; border-radius: var(--radius); font-size: 14px; line-height: 20px; font-weight: 600; cursor: pointer; background: var(--btn2); color: var(--text); text-align: center; transition: background .12s, color .12s; max-width: 100%; }
.btn:hover { background: var(--btn2-hover); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-dark); }
.btn.tertiary { background: transparent; color: var(--link); padding: 6px 10px; }
.btn.tertiary:hover { background: var(--primary-light); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger:hover { background: var(--bad-hover); }
.btn:disabled { background: var(--g50); color: var(--g200); cursor: default; }
.btn.primary:disabled { background: var(--primary-light); color: #fff; }
.btn .ic { width: 20px; height: 20px; margin-left: -4px; }
.ibtn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: var(--radius); background: transparent; color: var(--text); cursor: pointer; flex: none; }
.ibtn:hover { background: var(--primary-fair); color: var(--primary); }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--divider); margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 10px 12px; border: 0; background: none; color: var(--text-2); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--link); border-bottom-color: var(--primary); }
.tabpanel[hidden] { display: none; }

/* Contact */
.who { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; min-width: 0; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 500; font-size: 16px; flex: none; }
.who-n { font-size: 20px; line-height: 28px; font-weight: 500; overflow-wrap: anywhere; }
.who-s { font-size: 12px; line-height: 16px; color: var(--text-2); }
.rows > * + * { border-top: 1px solid var(--divider); }
.row { display: flex; align-items: center; gap: 4px 12px; padding: 8px 0; min-width: 0; }
.row-m { flex: 1 1 0; min-width: 0; }
.row.nw .row-m { flex-basis: 0 !important; }
@container card (max-width: 300px) { .row:not(.nw) { flex-wrap: wrap; } .row-m { flex-basis: calc(100% - 44px); } .lead + .row-m + .row-a { margin-left: 38px; } }
.row-t { font-weight: 500; overflow-wrap: anywhere; }
.row-s { font-size: 12px; line-height: 16px; color: var(--text-2); overflow-wrap: anywhere; }
.row-a { display: flex; gap: 0; margin-left: auto; flex: none; }
.lead { width: 32px; height: 32px; border-radius: var(--radius); background: var(--primary-fair); color: var(--primary); display: grid; place-items: center; flex: none; }
:root[data-theme="dark"] .lead { color: #dbacf5; }

/* Table */
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--link); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--divider); white-space: nowrap; }
.tbl td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--divider); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:nth-child(even) td { background: var(--canvas); }

/* Timeline */
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.pill { min-height: 28px; padding: 4px 12px; border: 0; border-radius: 999px; background: var(--btn2); font-size: 12px; line-height: 20px; font-weight: 500; cursor: pointer; }
.pill:hover { background: var(--btn2-hover); }
.pill[aria-pressed="true"] { background: var(--primary); color: #fff; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: flex; gap: 12px; padding: 10px 0; }
.tl li + li { border-top: 1px solid var(--divider); }
.tl li[hidden] { display: none; }
.tl-m { flex: 1; min-width: 0; }
.tl-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.tl-t { font-weight: 500; }
.tl-d { margin-left: auto; font-size: 12px; line-height: 16px; color: var(--text-3); white-space: nowrap; }
.tl-x { color: var(--text-2); margin-top: 2px; overflow-wrap: anywhere; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--radius); padding: 12px 16px; min-width: 0; }
.kpi-l { font-size: 12px; line-height: 16px; color: var(--text-2); }
.kpi-v { font-size: 24px; line-height: 32px; font-weight: 500; margin-top: 4px; overflow-wrap: anywhere; }
.kpi-v small { font-size: 12px; font-weight: 400; color: var(--text-3); margin-left: 4px; }

/* Replies, checklist, notes */
.reply { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--divider); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.reply + .reply { margin-top: 8px; }
.reply:hover { border-color: var(--primary); background: var(--primary-fair); }
.reply b { display: block; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--link); margin-bottom: 2px; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.chk input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--primary); flex: none; }
.tpls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
textarea.notes { display: block; width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px; border: 1px solid var(--g200); border-radius: var(--radius); background: var(--surface); }
textarea.notes:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-fair); }
textarea.notes::placeholder { font-style: italic; font-size: 12px; color: var(--text-3); }

/* Next best action */
.nba { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px; border-radius: var(--radius); background: var(--nba-bg); }
.nba-i { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); color: var(--primary); display: grid; place-items: center; flex: none; }
.nba-m { flex: 1 1 calc(100% - 56px); min-width: 0; }
.nba-t { font-size: 16px; line-height: 24px; font-weight: 500; }
.nba-x { color: var(--text-2); }
.nba-a { display: flex; flex-wrap: wrap; gap: 8px; margin-left: 56px; }
@container widget (max-width: 559px) { .nba-a { width: 100%; margin-left: 0; } .nba-a .btn { flex: 1 1 auto; } }

/* Toast (preview feedback; the Agent Application also gets widget.alert) */
.toast { position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 16px); opacity: 0; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: var(--radius); background: var(--g600); color: #fff; transition: opacity .18s, transform .18s; pointer-events: none; z-index: 9; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.ok .ic { color: var(--ok); } .toast.warn .ic { color: var(--warn); } .toast.bad .ic { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.nst-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nst-bars{display:flex;align-items:flex-end;gap:3px;height:22px}
.nst-bar{width:5px;background:var(--g600);border-radius:2px}
.nst-bar.down{background:var(--bad)}
.nst-badge{font-size:12px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn-text)}
.nst-meta{display:flex;flex-direction:column;gap:2px}
.nst-label{font-size:12px;color:var(--text-2)}
.nst-value{font-size:14px;font-weight:500;color:var(--text)}

</style>

  const emit = (name, data) => (S.handlers[name] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } });
  const on = (name, fn) => { (S.handlers[name] = S.handlers[name] || []).push(fn); };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const digits = n => String(n || '').replace(/[^\d+]/g, '');
  const reg = a => { S.acts.push(a || {}); return S.acts.length - 1; };

  let toastT;
  function toast(msg, kind = 'ok') {
    const el = $('#toast');
    el.className = 'toast on ' + kind;
    el.innerHTML = ic(kind === 'ok' ? 'check_circle' : kind === 'bad' ? 'error' : 'info') + `<span>${esc(msg)}</span>`;
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2800);
  }

  // ---------- buttons and actions ----------
  function btn(b) {
    const id = reg(b.action);
    if (b.key) S.keys.push([b.key, id]);
    const tip = [b.title || b.label, b.key && b.key.replace('alt+', 'Alt+').toUpperCase().replace('ALT+', 'Alt+')].filter(Boolean).join(' · ');
    return `<button type="button" class="btn${b.style ? ' ' + esc(b.style) : ''}" data-act="${id}" title="${esc(tip)}">${ic(b.icon)}${b.label ? `<span>${esc(b.label)}</span>` : ''}</button>`;
  }
  const ibtn = (icon, title, action, fb) => `<button type="button" class="ibtn" data-act="${reg(action)}" title="${esc(title)}" aria-label="${esc(title)}">${ic(icon)}</button>`;
  const phoneBtns = (number, ops, name) => ops.map(op => ({
    dial: () => ibtn('call', `${L.call} ${number}`, { type: 'dial', number }),
    sms: () => ibtn('sms', `${L.sms} ${number}`, { type: 'sms', number }, 'SMS'),
    transfer: () => ibtn('phone_forwarded', `${L.transfer} ${number}`, { type: 'transfer', number, name }),
    consult: () => ibtn('headset_mic', `${L.consult} ${number}`, { type: 'consult', number, name })
  }[op] || (() => ''))()).join('');

  const need = () => { if (!S.api) { toast(L.notConnected, 'warn'); return false; } return true; };
  const needSession = () => { if (!S.ctx || !S.ctx.sessionId) { toast(L.noSession, 'warn'); return false; } return true; };
  const alertHost = msg => S.api && S.api.call('widget.alert', 'success', msg, { timeout: 2500 }).catch(() => {});

  async function act(a, el) {
    try {
      switch (a.type) {
        case 'dial': {
          if (!need()) return;
          const ok = (await S.api.get('call.allowOutboundCall')) && (await S.api.get('call.canExecuteOutboundCall'));
          if (!ok) return toast(L.cannotCall, 'warn');
          await S.api.call('call.outboundCallExtended', digits(a.number), a.tags || {}, a.variables || []);
          return toast(`${L.calling} ${a.name || a.number}`);
        }
        case 'sms': {
          if (!need()) return;
          if (!(await S.api.get('message.allowSendSms'))) return toast(L.smsBlocked, 'warn');
          await S.api.call('message.openSendSMSDialog', { number: digits(a.number), message: a.message || '', variables: a.variables || {} });
          return;
        }
        case 'email': {
          if (!need()) return;
          if (!(await S.api.get('message.allowSendEmailViaPuzzel'))) return toast(L.emailBlocked, 'warn');
          await S.api.call('message.openSendEmailDialog', { emailAddress: a.to || '', emailSubject: a.subject || '', message: a.message || '', variables: a.variables || {} });
          return;
        }
        case 'transfer': case 'consult': {
          if (!need() || !needSession()) return;
          const m = a.type === 'transfer' ? 'call.transferToPhone' : 'call.consultWithPhone';
          await S.api.call(m, S.ctx.sessionId, digits(a.number), { phoneNumber: digits(a.number), name: a.name || '' });
          return toast(`${a.type === 'transfer' ? L.transfer : L.consult}: ${a.name || a.number}`);
        }
        case 'callback': {
          if (!need()) return;
          await S.api.call('task.openScheduleTaskDialog', a.data || {});
          return;
        }
        case 'chatText': {
          if (!need() || !needSession()) return;
          await S.api.call(S.ctx.kind === 'classicChat' ? 'chat.setText' : 'webEngage.setText', S.ctx.sessionId, a.text, !!a.replace);
          return toast(a.done || L.inserted);
        }
        case 'tagCall': {
          if (!need() || !needSession()) return;
          await S.api.call('call.updateTags', S.ctx.sessionId, a.tags || {});
          return toast(a.done || L.saved);
        }
        case 'copy': {
          await navigator.clipboard.writeText(a.text || '');
          return toast(L.copied);
        }
        case 'system': {
          // Simulated write to the customer's own system. A real build replaces this with a call to their API.
          if (el) el.disabled = true;
          await sleep(a.latency ?? 450);
          const notes = a.notesFrom ? ($(`#${a.notesFrom}`) || {}).value : undefined;
          if (a.set) Object.entries(a.set).forEach(([id, v]) => { const t = document.getElementById(id); if (t) t.outerHTML = val(Object.assign({ id }, typeof v === 'object' ? v : { value: v })); });
          if (el) { if (a.doneLabel) { const s = el.querySelector('span'); if (s) s.textContent = a.doneLabel; } else el.disabled = false; }
          const msg = a.done || `${a.operation}: ${a.system}`;
          toast(msg); alertHost(msg);
          emit('system', { action: a, notes, ctx: S.ctx });
          return;
        }
        default: console.warn('Unknown action', a);
      }
    } catch (e) { console.error(e); toast(String((e && e.message) || e), 'bad'); }
  }

  // ---------- components ----------
  function val(r) {
    const id = r.id ? ` id="${esc(r.id)}"` : '';
    if (r.tone) return `<span${id} class="chip${tone(r.tone)}">${ic(r.icon)}${esc(r.value)}</span>`;
    return `<span${id}${r.mono || r.num ? ' class="num"' : ''}>${esc(r.value)}</span>`;
  }
  const head = c => (c.title || c.source) ? `<div class="card-h">${ic(c.icon)}<span class="card-t">${esc(c.title || '')}</span>${c.source ? `<span class="src">${esc(c.source)}</span>` : ''}</div>` : '';
  const acts = list => list && list.length ? `<div class="card-acts">${list.map(btn).join('')}</div>` : '';
  const card = (c, inner) => `<section class="card${c.full === false ? '' : ' full'}"${c.id ? ` id="${esc(c.id)}"` : ''}>${head(c)}<div class="card-b">${inner}</div>${acts(c.actions)}</section>`;
  const kv = rows => `<dl class="kv">${(rows || []).map(r => `<dt>${esc(r.label)}</dt><dd>${val(r)}</dd>`).join('')}</dl>`;

  const C = {
    contact: c => {
      const initials = c.initials || String(c.name || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const lines = [];
      (c.phones || []).forEach(p => lines.push(`<div class="row nw"><div class="row-m"><div class="row-s">${esc(p.label)}</div><div class="num">${esc(p.number)}</div></div><div class="row-a">${phoneBtns(p.number, p.ops || ['dial', 'sms'], c.name)}</div></div>`));
      (c.emails || []).forEach(m => lines.push(`<div class="row nw"><div class="row-m"><div class="row-s">${esc(m.label)}</div><div style="overflow-wrap:anywhere">${esc(m.address)}</div></div><div class="row-a">${ibtn('mail', `${L.email} ${m.address}`, { type: 'email', to: m.address, subject: m.subject || '' }, 'Mail')}</div></div>`));
      const tags = c.tags && c.tags.length ? `<div class="tags" style="margin-top:12px">${c.tags.map(t => `<span class="chip${tone(t.tone)}">${ic(t.icon)}${esc(t.text)}</span>`).join('')}</div>` : '';
      return card(c, `<div class="who"><div class="avatar">${esc(initials)}</div><div style="min-width:0"><div class="who-n">${esc(c.name)}</div><div class="who-s">${esc(c.subtitle || '')}</div></div></div>${lines.length ? `<div class="rows" style="margin-bottom:8px">${lines.join('')}</div>` : ''}${c.fields && c.fields.length ? kv(c.fields) : ''}${tags}`);
    },
    fields: c => card(c, kv(c.rows)),
    table: c => card(c, `<div class="tblwrap"><table class="tbl"><thead><tr>${(c.columns || []).map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.rows || []).map(row => `<tr>${row.map(v => `<td>${v && typeof v === 'object' ? val(v) : esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`),
    timeline: c => {
      const types = [...new Set((c.items || []).map(i => i.type).filter(Boolean))];
      const pills = c.filters !== false && types.length > 1 ? `<div class="pills" role="group">${[L.all, ...types].map((t, i) => `<button type="button" class="pill" data-filter="${i ? esc(t) : '*'}" aria-pressed="${!i}">${esc(t)}</button>`).join('')}</div>` : '';
      return card(c, `${pills}<ul class="tl">${(c.items || []).map(i => `<li data-type="${esc(i.type || '')}"><span class="lead">${ic(i.icon || 'event')}</span><div class="tl-m"><div class="tl-top"><span class="tl-t">${esc(i.title)}</span>${i.tag ? `<span class="chip${tone(i.tone)}">${esc(i.tag)}</span>` : ''}<span class="tl-d num">${esc(i.date || '')}</span></div>${i.detail ? `<div class="tl-x">${esc(i.detail)}</div>` : ''}</div></li>`).join('')}</ul>`);
    },
    kpis: c => `<div class="kpis full">${(c.items || []).map(k => `<div class="kpi"><div class="kpi-l">${esc(k.label)}</div><div class="kpi-v num">${k.tone ? `<span class="chip${tone(k.tone)}" style="font-size:16px;line-height:24px">${esc(k.value)}</span>` : esc(k.value)}${k.unit ? `<small>${esc(k.unit)}</small>` : ''}</div></div>`).join('')}</div>`,
    actions: c => card(Object.assign({}, c, { actions: null }), `<div class="tags">${(c.buttons || []).map(btn).join('')}</div>`),
    directory: c => card(c, `<div class="rows">${(c.entries || []).map(e => `<div class="row"><span class="lead">${ic(e.icon || 'contact_phone')}</span><div class="row-m"><div class="row-t">${esc(e.name)}</div><div class="row-s">${esc(e.detail || '')}</div>${e.number ? `<div class="row-s num">${esc(e.number)}</div>` : ''}</div><div class="row-a">${phoneBtns(e.number, e.ops || ['dial'], e.name)}</div></div>`).join('')}</div>`),
    replies: c => card(c, (c.items || []).map(r => `<button type="button" class="reply" data-act="${reg({ type: 'chatText', text: r.text, done: r.done })}"><b>${esc(r.label)}</b>${esc(r.text)}</button>`).join('')),
    checklist: c => card(c, (c.items || []).map((t, i) => `<label class="chk"><input type="checkbox" data-chk="${esc(c.id || 'chk')}-${i}"><span>${esc(t)}</span></label>`).join('')),
    notes: c => {
      const nid = (c.id || 'notes') + '-text';
      const tpls = c.templates && c.templates.length ? `<div class="tpls">${c.templates.map(t => `<button type="button" class="pill" data-tpl="${esc(nid)}" data-text="${esc(t.text)}">${esc(t.label)}</button>`).join('')}</div>` : '';
      const save = c.save ? [Object.assign({ icon: 'save', style: 'primary' }, c.save, { action: Object.assign({ type: 'system', notesFrom: nid }, c.save.action) })] : [];
      return card(Object.assign({}, c, { actions: save.concat(c.actions || []) }), `${tpls}<textarea class="notes" id="${esc(nid)}" placeholder="${esc(c.placeholder || '')}">${esc(c.text || '')}</textarea>`);
    },
    nba: c => `<section class="nba full"><span class="nba-i">${ic(c.icon || 'lightbulb_2')}</span><div class="nba-m"><div class="nba-t">${esc(c.title)}</div><div class="nba-x">${esc(c.text || '')}</div></div><div class="nba-a">${(c.buttons || []).map(btn).join('')}</div></section>`,
    signature: c => card(c, `<div id="signature-root">${document.getElementById('signature-html').innerHTML}</div>`)
  };
  const comp = c => (C[c.type] ? C[c.type](c) : '');
  const many = list => (list || []).map(comp).join('');

  function render() {
    const h = cfg.header || {};
    const tile = h.logo ? `<img src="${esc(h.logo)}" alt="">` : esc(h.initials || String(h.title || '?').slice(0, 1));
    const lay = cfg.layout || {};
    const main = lay.tabs
      ? `<div><div class="tabs" role="tablist">${lay.tabs.map((t, i) => `<button type="button" class="tab" role="tab" id="tab-${i}" aria-controls="panel-${i}" aria-selected="${i === 0}" tabindex="${i ? -1 : 0}">${ic(t.icon)}${esc(t.label)}</button>`).join('')}</div>${lay.tabs.map((t, i) => `<div class="tabpanel grid2" role="tabpanel" id="panel-${i}" aria-labelledby="tab-${i}"${i ? ' hidden' : ''}>${many(t.items)}</div>`).join('')}</div>`
      : `<div class="grid2">${many(lay.main)}</div>`;
    const rail = lay.sidebar && lay.sidebar.length;
    const w = $('#widget');
    w.setAttribute('aria-label', h.title || 'Widget');
    w.innerHTML = `<header class="hdr"><div class="tile">${tile}</div><div><div class="hdr-t">${esc(h.title)}</div>${h.subtitle ? `<div class="hdr-s">${esc(h.subtitle)}</div>` : ''}</div></header>
      <div class="body${rail ? ' rail' : ''}">${rail ? `<aside class="col" aria-label="Customer">${many(lay.sidebar)}</aside>` : ''}<div class="col main">${main}</div></div>
      ${lay.footer ? `<div class="foot">${many(lay.footer)}</div>` : ''}`;
    S.keys.forEach(([combo, id]) => window.Mousetrap && Mousetrap.bindGlobal && Mousetrap.bindGlobal(combo, e => { e.preventDefault(); act(S.acts[id]); }));
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (b) return act(S.acts[+b.dataset.act], b);
    const t = e.target.closest('[role="tab"]');
    if (t) { $$('[role="tab"]', t.parentElement).forEach(x => { const sel = x === t; x.setAttribute('aria-selected', sel); x.tabIndex = sel ? 0 : -1; document.getElementById(x.getAttribute('aria-controls')).hidden = !sel; }); return; }
    const p = e.target.closest('[data-filter]');
    if (p) { const cd = p.closest('.card'); $$('.pill', cd).forEach(x => x.setAttribute('aria-pressed', x === p)); $$('.tl li', cd).forEach(li => { li.hidden = p.dataset.filter !== '*' && li.dataset.type !== p.dataset.filter; }); return; }
    const tp = e.target.closest('[data-tpl]');
    if (tp) { const ta = document.getElementById(tp.dataset.tpl); ta.value = (ta.value ? ta.value + '\n' : '') + tp.dataset.text; ta.focus(); }
  });
  document.addEventListener('keydown', e => {
    const t = e.target.closest && e.target.closest('[role="tab"]'); if (!t || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    const tabs = $$('[role="tab"]', t.parentElement); const n = tabs[(tabs.indexOf(t) + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    n.focus(); n.click();
  });

  // ---------- Puzzel Widget API ----------
  // The Agent Application gives each contact its own tab, and each tab its own widget instance,
  // so the widget tracks one active contact and never lists contacts itself.
  function setContext(ctx) {
    const first = !S.ctx || S.ctx.sessionId !== ctx.sessionId;
    S.ctx = ctx;
    emit('context', ctx);
    if (first && cfg.onContact) act(Object.assign({ latency: 250 }, cfg.onContact));
    if (first && cfg.tabInfo && S.api) S.api.call('tab.setInfo', cfg.tabInfo).catch(() => {});
  }
  async function connect() {
    if (!window.widgetApiLib) return;
    const api = await widgetApiLib.connect();
    S.api = api;
    const ch = cfg.channels || ['phone'];
    const fromCall = call => setContext({ channel: 'phone', kind: 'call', sessionId: call.sessionId, from: call.caller, raw: call });
    const ended = sessionId => { if (S.ctx && S.ctx.sessionId === sessionId) emit('ended', S.ctx); };
    if (ch.includes('phone')) {
      api.on('SYSTEM_INCOMING_CALL', ({ call }) => fromCall(call));
      api.on('SYSTEM_CALLOUT_CALL', ({ call }) => fromCall(call));
      api.on('SYSTEM_CALL_STATE_CHANGE', ({ call }) => { if (call && call.isEnded) ended(call.sessionId); });
    }
    if (ch.includes('chat')) {
      api.on('SYSTEM_WEB_ENGAGE_INCOMING_CHAT', ({ session }) => setContext({ channel: 'chat', kind: 'webEngage', sessionId: session.sessionId, from: session.request && session.request.remoteAddress, raw: session }));
      api.on('SYSTEM_WEB_ENGAGE_CHAT_STATUS_CHANGE', ({ session }) => { if (session && session.state === 'disconnected') ended(session.sessionId); });
      api.on('SYSTEM_INCOMING_CHAT', ({ chat }) => setContext({ channel: 'chat', kind: 'classicChat', sessionId: chat.sessionId, raw: chat }));
    }
    if (ch.includes('email')) api.on('SYSTEM_INCOMING_EMAIL', ({ email }) => setContext({ channel: 'email', kind: 'email', sessionId: email.sessionId, from: email.from, raw: email }));
    if (ch.includes('social')) api.on('SYSTEM_INCOMING_SOCIAL', ({ request }) => setContext({ channel: 'social', kind: 'social', sessionId: request.sessionId, from: request.user, raw: request }));
    emit('connected', api);
    api.ready();
    try {
      if (await api.call('agent.darkMode')) document.documentElement.dataset.theme = 'dark';
      const sid = await api.get('tab.sessionId');
      if (sid && !S.ctx) {
        const cur = ch.includes('phone') ? await api.call('call.getCurrentCall') : null;
        if (cur && cur.sessionId === sid) fromCall(cur);
        else setContext({ channel: ch.includes('chat') ? 'chat' : ch[0], kind: 'webEngage', sessionId: sid });
      }
    } catch (e) { /* optional reads */ }
  }

  return { cfg, S, act, on, toast, render, connect, setContext, esc, ic };
})();
W.render();
</script>
<script>

(function () {
  var TARGET_QUEUE = 'q_Rayhan_Support_queue';
  W.on('connected', function (api) {
    api.on('SYSTEM_INCOMING_CALL', function (evt) {
      var call = evt && evt.call;
      var onTargetQueue = call && call.queueKey === TARGET_QUEUE;
      api.call('widget.preventShow', !onTargetQueue);
    });
  });
})();

</script>
<script>
W.connect().catch(e => console.error('Widget API', e));
</script>
</body>
</html>
